<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliothèque du CE Ambarès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-dark: #2b1a10;
    --wood: #4a2f1d;
    --leather: #2f4a3e;
    --brass: #b08d57;
    --brass-light: #d7b876;
    --parchment: #f3ead9;
    --parchment-edge: #e6d7b8;
    --ink: #2b2016;
    --ink-soft: #5a4a38;
    --ok: #2f5d3a;
    --warn: #8a5a12;
    --busy: #7a2e22;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'EB Garamond', Georgia, serif;
    margin: 0;
    padding: 0 0 60px;
    color: var(--ink);
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%),
      repeating-linear-gradient(115deg, #3a2415, #3a2415 2px, #35200f 2px, #35200f 4px),
      var(--wood-dark);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 38px 16px 26px;
    border-bottom: 6px solid var(--brass);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 32px;
    color: var(--brass-light);
    margin: 0 0 6px;
    letter-spacing: 0.3px;
    text-shadow: 0 2px 3px rgba(0,0,0,0.4);
  }
  .subtitle {
    color: #cbb98f;
    font-size: 14px;
    font-style: italic;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .controls {
    background: var(--parchment);
    border: 1px solid var(--parchment-edge);
    border-radius: 4px;
    padding: 16px;
    margin: 26px 0;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(176,141,87,0.25);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .controls input[type=text] {
    flex: 1 1 220px;
    padding: 9px 12px;
    border: 1px solid var(--brass);
    border-radius: 3px;
    font-size: 15px;
    font-family: inherit;
    background: #fffdf8;
    color: var(--ink);
  }
  .controls select {
    padding: 9px 10px;
    border: 1px solid var(--brass);
    border-radius: 3px;
    font-size: 14px;
    font-family: inherit;
    background: #fffdf8;
    color: var(--ink);
  }
  .count {
    font-size: 13px;
    color: #cbb98f;
    margin: 18px 0 4px;
    text-align: center;
    font-style: italic;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 22px;
    margin-top: 18px;
  }
  .card {
    background: var(--parchment);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    border-top: 5px solid var(--brass);
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: #ddd;
  }
  .card-body {
    padding: 10px 12px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 3px;
    color: var(--ink);
  }
  .card-author {
    font-size: 13px;
    font-style: italic;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .badges {
    margin-top: auto;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
    border: 1px solid rgba(0,0,0,0.12);
  }
  .badge.type { background: #e3d9c2; color: var(--ink-soft); }
  .badge.statut.disponible { background: #e1ecdf; color: var(--ok); }
  .badge.statut.reserve { background: #f3e3c4; color: var(--warn); }
  .badge.statut.emprunte { background: #f0dcd6; color: var(--busy); }

  /* Fiche détail (overlay) */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,9,4,0.72);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .overlay.open { display: flex; }
  .detail {
    background: var(--parchment);
    border: 1px solid var(--brass);
    border-radius: 6px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .detail .close {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 24px;
    cursor: pointer;
    color: var(--ink-soft);
    background: none;
    border: none;
    font-family: Georgia, serif;
  }
  .detail img {
    width: 140px;
    float: left;
    margin: 0 16px 10px 0;
    border-radius: 3px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .detail h2 {
    font-family: 'Playfair Display', Georgia, serif;
    margin: 0 0 4px;
    font-size: 20px;
    color: var(--ink);
  }
  .detail .author { color: var(--ink-soft); font-style: italic; margin: 0 0 10px; }
  .detail .meta { font-size: 13px; color: var(--ink-soft); margin: 4px 0; }
  .detail .resume { clear: both; padding-top: 12px; font-size: 15px; line-height: 1.6; border-top: 1px solid var(--parchment-edge); margin-top: 10px; }
  .empty {
    text-align: center;
    color: #cbb98f;
    font-style: italic;
    padding: 50px 0;
  }
</style>
</head>
<body>

<header>
  <h1>📚 Bibliothèque du CE Ambarès</h1>
  <div class="subtitle" id="counter">Chargement du catalogue...</div>
</header>

<div class="page">
<div class="controls">
  <input type="text" id="search" placeholder="Rechercher un titre ou un auteur...">
  <select id="filterType"><option value="">Tous les types</option></select>
  <select id="filterGenre"><option value="">Tous les genres</option></select>
  <select id="filterAuteur"><option value="">Tous les auteurs</option></select>
  <select id="filterStatut"><option value="">Tous les statuts</option></select>
</div>

<div id="grid" class="grid"></div>
<div id="emptyMsg" class="empty" style="display:none">Aucun livre ne correspond à ta recherche.</div>
</div>

<div class="overlay" id="overlay">
  <div class="detail">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
  // ⚠️ À MODIFIER : colle ici l'URL de ton déploiement Apps Script (se termine par /exec)
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGtR_DyQPRuYKKRqVm-HeeS7trpO9GaOHrUdgcDo7-pY0eyzQ58_J6GLvHSXv_Ngep/exec';

  var allBooks = [];

  function statutClass(s) {
    s = (s || '').toLowerCase();
    if (s.indexOf('dispo') === 0) return 'disponible';
    if (s.indexOf('reserv') === 0) return 'reserve';
    if (s.indexOf('emprunt') === 0) return 'emprunte';
    return '';
  }

  function loadCatalog() {
    fetch(APPS_SCRIPT_URL + '?action=catalog')
      .then(function(r) { return r.json(); })
      .then(function(books) {
        allBooks = books;
        populateFilters(books);
        render();
      })
      .catch(function(err) {
        document.getElementById('counter').innerText = 'Erreur de chargement : ' + err.message;
      });
  }

  function populateFilters(books) {
    var types = [...new Set(books.map(function(b){return b.type;}).filter(Boolean))].sort();
    var genres = [...new Set(books.map(function(b){return b.genre;}).filter(Boolean))].sort();
    var auteurs = [...new Set(books.map(function(b){return b.auteur;}).filter(Boolean))].sort();
    var statuts = [...new Set(books.map(function(b){return b.statut;}).filter(Boolean))].sort();

    fillSelect('filterType', types);
    fillSelect('filterGenre', genres);
    fillSelect('filterAuteur', auteurs);
    fillSelect('filterStatut', statuts);
  }

  function fillSelect(id, values) {
    var sel = document.getElementById(id);
    values.forEach(function(v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
  }

  function render() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var fType = document.getElementById('filterType').value;
    var fGenre = document.getElementById('filterGenre').value;
    var fAuteur = document.getElementById('filterAuteur').value;
    var fStatut = document.getElementById('filterStatut').value;

    var filtered = allBooks.filter(function(b) {
      if (fType && b.type !== fType) return false;
      if (fGenre && b.genre !== fGenre) return false;
      if (fAuteur && b.auteur !== fAuteur) return false;
      if (fStatut && b.statut !== fStatut) return false;
      if (q) {
        var hay = (b.titre + ' ' + b.auteur).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    document.getElementById('counter').innerText =
      allBooks.length + ' ouvrages au catalogue — ' + filtered.length + ' affiché(s)';

    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.getElementById('emptyMsg').style.display = filtered.length ? 'none' : 'block';

    filtered.forEach(function(b) {
      var card = document.createElement('div');
      card.className = 'card';
      card.onclick = function() { openDetail(b); };
      card.innerHTML =
        '<img src="' + (b.jaquette || '') + '" alt="" onerror="this.style.opacity=0.3">' +
        '<div class="card-body">' +
          '<p class="card-title">' + escapeHtml(b.titre) + '</p>' +
          '<p class="card-author">' + escapeHtml(b.auteur) + '</p>' +
          '<div class="badges">' +
            (b.type ? '<span class="badge type">' + escapeHtml(b.type) + '</span>' : '') +
            (b.statut ? '<span class="badge statut ' + statutClass(b.statut) + '">' + escapeHtml(b.statut) + '</span>' : '') +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  function openDetail(b) {
    document.getElementById('detailContent').innerHTML =
      '<img src="' + (b.jaquette || '') + '" alt="">' +
      '<h2>' + escapeHtml(b.titre) + '</h2>' +
      '<p class="author">' + escapeHtml(b.auteur) + '</p>' +
      '<p class="meta"><strong>Type :</strong> ' + escapeHtml(b.type || '—') + '</p>' +
      '<p class="meta"><strong>Genre :</strong> ' + escapeHtml(b.genre || '—') + '</p>' +
      '<p class="meta"><strong>Statut :</strong> ' + escapeHtml(b.statut || '—') + '</p>' +
      '<p class="resume">' + escapeHtml(b.resume || 'Pas de résumé disponible.') + '</p>';
    document.getElementById('overlay').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('overlay').classList.remove('open');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filterType').addEventListener('change', render);
  document.getElementById('filterGenre').addEventListener('change', render);
  document.getElementById('filterAuteur').addEventListener('change', render);
  document.getElementById('filterStatut').addEventListener('change', render);
  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeDetail();
  });

  loadCatalog();
</script>
</body>
</html>
